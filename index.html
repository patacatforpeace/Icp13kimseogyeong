<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FreelanceHub — 외주 통합 관리 대시보드</title>
<style>
  /* ============================================================
     TOKENS — color, type, space
     Palette derived from the dataviz skill's validated reference
     instance (categorical / status steps), with a single bespoke
     violet accent reserved for brand (never reused as a data color).
     ============================================================ */
  :root{
    color-scheme: light;
    --bg: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #f2f1ed;
    --surface-3: #eae8e2;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-muted: #898781;
    --border: rgba(11,11,11,0.10);
    --border-strong: rgba(11,11,11,0.16);

    --accent: #4a3aa7;
    --accent-ink: #ffffff;
    --accent-wash: #efedfa;

    --good: #0ca30c;
    --good-wash: #e6f5e3;
    --warning: #c98500;
    --warning-wash: #fdf1dc;
    --serious: #d1602f;
    --serious-wash: #fbe9e0;
    --critical: #d03b3b;
    --critical-wash: #fbe6e6;
    --info: #184f95;
    --info-wash: #e5edf9;
    --neutral-wash: #eeede8;

    --shadow: 0 1px 2px rgba(11,11,11,0.04), 0 4px 16px rgba(11,11,11,0.05);
    --radius: 10px;
    --radius-sm: 7px;

    --font-sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic",
      "Pretendard Variable", Pretendard, "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Roboto Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg: #0d0d0d;
      --surface: #1a1a19;
      --surface-2: #222220;
      --surface-3: #2c2c2a;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --ink-muted: #8f8d87;
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.18);

      --accent: #9085e9;
      --accent-ink: #17152c;
      --accent-wash: #26234a;

      --good: #0ca30c;
      --good-wash: #163d1a;
      --warning: #e0a223;
      --warning-wash: #4a3712;
      --serious: #ec835a;
      --serious-wash: #4a2a1c;
      --critical: #e66767;
      --critical-wash: #4a1f1f;
      --info: #3987e5;
      --info-wash: #17273f;
      --neutral-wash: #2a2a27;

      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #222220;
    --surface-3: #2c2c2a;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-muted: #8f8d87;
    --border: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.18);

    --accent: #9085e9;
    --accent-ink: #17152c;
    --accent-wash: #26234a;

    --good: #0ca30c;
    --good-wash: #163d1a;
    --warning: #e0a223;
    --warning-wash: #4a3712;
    --serious: #ec835a;
    --serious-wash: #4a2a1c;
    --critical: #e66767;
    --critical-wash: #4a1f1f;
    --info: #3987e5;
    --info-wash: #17273f;
    --neutral-wash: #2a2a27;

    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.35);
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
    line-height: 1.5;
  }
  ::selection{ background: var(--accent-wash); }
  button, input, select{ font-family: inherit; font-size: inherit; color: inherit; }
  button{ cursor:pointer; }
  a{ color: inherit; }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .app{
    display:grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
  }

  /* ---------------- Sidebar ---------------- */
  .sidebar{
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px 14px;
    display:flex;
    flex-direction:column;
    gap: 24px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding: 4px 8px;
  }
  .brand-mark{
    width:30px; height:30px; border-radius: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:14px;
    flex-shrink:0;
  }
  .brand-name{ font-weight:700; font-size:15px; letter-spacing:-0.01em; }
  .brand-sub{ font-size:11px; color:var(--ink-muted); }

  .nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding: 9px 10px;
    border-radius: var(--radius-sm);
    border:none; background:transparent;
    color: var(--ink-2);
    text-align:left;
    font-size:13.5px;
    font-weight:500;
    width:100%;
  }
  .nav-item:hover{ background: var(--surface-2); color: var(--ink); }
  .nav-item.active{ background: var(--accent-wash); color: var(--accent); font-weight:700; }
  .nav-icon{ width:16px; height:16px; flex-shrink:0; }
  .nav-badge{
    margin-left:auto;
    font-size:11px; font-weight:700;
    background: var(--critical); color:#fff;
    border-radius: 999px;
    min-width:18px; height:18px;
    display:flex; align-items:center; justify-content:center;
    padding: 0 5px;
  }
  .nav-badge[hidden]{ display:none; }

  .sidebar-spacer{ flex:1; }
  .user-card{
    display:flex; align-items:center; gap:10px;
    padding: 10px; border-radius: var(--radius);
    background: var(--surface-2);
    border: 1px solid var(--border);
  }
  .user-avatar{
    width:32px; height:32px; border-radius:50%;
    background: var(--info-wash); color: var(--info);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px; flex-shrink:0;
  }
  .user-name{ font-size:12.5px; font-weight:700; }
  .user-role{ font-size:11px; color:var(--ink-muted); }

  /* ---------------- Main ---------------- */
  .main{ display:flex; flex-direction:column; min-width:0; }
  .topbar{
    display:flex; align-items:center; gap:16px;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    position: sticky; top:0; background: var(--bg);
    z-index: 5;
  }
  .topbar-title{ font-size: 19px; font-weight:800; letter-spacing:-0.01em; }
  .topbar-date{ font-size:12px; color: var(--ink-muted); }
  .topbar-spacer{ flex:1; }
  .btn{
    display:inline-flex; align-items:center; gap:6px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink);
    padding: 8px 13px;
    font-size: 13px; font-weight:600;
    white-space:nowrap;
  }
  .btn:hover{ background: var(--surface-2); }
  .btn-primary{
    background: var(--accent); color: var(--accent-ink); border-color: transparent;
  }
  .btn-primary:hover{ filter: brightness(1.06); }
  .btn-sm{ padding: 5px 10px; font-size:12px; }
  .btn-ghost{ border-color: transparent; background:transparent; }
  .btn-ghost:hover{ background: var(--surface-2); }

  .view{ padding: 22px 28px 60px; display:none; flex-direction:column; gap:22px; }
  .view.active{ display:flex; }

  .section-title{ font-size:14px; font-weight:800; margin: 0 0 2px; }
  .section-sub{ font-size:12px; color: var(--ink-muted); margin:0 0 12px; }

  /* ---------------- Stat tiles ---------------- */
  .kpi-row{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  .kpi-tile{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 15px 16px;
    box-shadow: var(--shadow);
    display:flex; flex-direction:column; gap:6px;
  }
  .kpi-label{ font-size:12px; color: var(--ink-muted); font-weight:600; display:flex; align-items:center; gap:6px;}
  .kpi-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .kpi-value{ font-size: 26px; font-weight:800; letter-spacing:-0.02em; font-variant-numeric: proportional-nums; }
  .kpi-note{ font-size:11.5px; color: var(--ink-muted); }
  .kpi-note strong{ color: var(--ink-2); font-weight:700; }

  /* ---------------- Cards / grids ---------------- */
  .grid-2{ display:grid; grid-template-columns: 1.3fr 1fr; gap:16px; align-items:start; }
  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
  }
  .card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .card-head h3{ font-size:13.5px; margin:0; font-weight:800; }

  .deadline-row{
    display:flex; align-items:center; gap:10px;
    padding: 9px 6px;
    border-bottom: 1px solid var(--border);
  }
  .deadline-row:last-child{ border-bottom:none; }
  .client-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .deadline-main{ flex:1; min-width:0; }
  .deadline-title{ font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .deadline-sub{ font-size:11.5px; color: var(--ink-muted); }
  .empty-note{ font-size:12.5px; color: var(--ink-muted); padding: 10px 6px; }

  .client-mini{
    display:flex; align-items:center; gap:10px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--border);
  }
  .client-mini:last-child{ border-bottom:none; }
  .client-avatar{
    width:30px; height:30px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:12px; color:#fff; flex-shrink:0;
  }
  .client-mini-name{ font-size:12.5px; font-weight:700; }
  .client-mini-meta{ font-size:11px; color: var(--ink-muted); }
  .client-mini-amount{ margin-left:auto; text-align:right; font-family: var(--font-mono); font-size:12px; font-variant-numeric: tabular-nums;}
  .client-mini-amount .receivable{ font-size:10.5px; color: var(--warning); display:block; font-family: var(--font-sans); }

  /* ---------------- Pills / badges ---------------- */
  .pill{
    display:inline-flex; align-items:center; gap:5px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11.5px; font-weight:700;
    white-space:nowrap;
  }
  .pill-dot{ width:6px; height:6px; border-radius:50%; }
  .pill-good{ background:var(--good-wash); color:var(--good); }
  .pill-warning{ background:var(--warning-wash); color:var(--warning); }
  .pill-serious{ background:var(--serious-wash); color:var(--serious); }
  .pill-critical{ background:var(--critical-wash); color:var(--critical); }
  .pill-info{ background:var(--info-wash); color:var(--info); }
  .pill-neutral{ background:var(--neutral-wash); color:var(--ink-2); }

  /* ---------------- Legend ---------------- */
  .legend{ display:flex; flex-wrap:wrap; gap: 12px 16px; padding: 2px 2px 0; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-2); }
  .legend-swatch{ width:9px; height:9px; border-radius:2px; flex-shrink:0; }

  /* ---------------- Board (Kanban) ---------------- */
  .filter-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .chip{
    border:1px solid var(--border-strong); background:var(--surface);
    border-radius:999px; padding:6px 12px; font-size:12px; font-weight:600;
    color: var(--ink-2); display:inline-flex; align-items:center; gap:6px;
  }
  .chip:hover{ background: var(--surface-2); }
  .chip.active{ background: var(--accent); border-color:transparent; color: var(--accent-ink); }
  .chip .swatch{ width:8px; height:8px; border-radius:50%; }

  .board{
    display:grid;
    grid-auto-flow: column;
    grid-auto-columns: 258px;
    gap: 14px;
    overflow-x: auto;
    padding-bottom: 10px;
  }
  .board-col{
    background: var(--surface-2);
    border:1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
    display:flex; flex-direction:column; gap:10px;
    min-height: 120px;
  }
  .board-col-head{ display:flex; align-items:center; justify-content:space-between; padding: 2px 4px; }
  .board-col-title{ font-size:12.5px; font-weight:800; }
  .board-col-count{ font-size:11px; color:var(--ink-muted); font-weight:700; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:1px 7px; }
  .board-cards{ display:flex; flex-direction:column; gap:8px; min-height:40px; }

  .proj-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px;
    box-shadow: var(--shadow);
    display:flex; flex-direction:column; gap:7px;
  }
  .proj-card-top{ display:flex; align-items:flex-start; gap:8px; }
  .proj-client{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-muted); font-weight:700; }
  .proj-title{ font-size:12.5px; font-weight:700; line-height:1.35; }
  .proj-meta{ display:flex; align-items:center; justify-content:space-between; font-size:11.5px; }
  .proj-amount{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .proj-progress-track{ height:5px; border-radius:999px; background: var(--surface-3); overflow:hidden; }
  .proj-progress-fill{ height:100%; background: var(--accent); border-radius:999px; }
  .proj-select{
    width:100%; padding:6px 8px; border-radius:6px; border:1px solid var(--border-strong);
    background: var(--surface); font-size:11.5px; font-weight:600;
  }

  /* ---------------- Calendar ---------------- */
  .cal-head{ display:flex; align-items:center; gap:10px; }
  .cal-title{ font-size:15px; font-weight:800; min-width:110px; }
  .cal-grid{
    display:grid; grid-template-columns: repeat(7, 1fr);
    border-top:1px solid var(--border); border-left:1px solid var(--border);
    border-radius: var(--radius); overflow:hidden;
  }
  .cal-dow{
    padding: 8px 0; text-align:center; font-size:11px; font-weight:700; color:var(--ink-muted);
    background: var(--surface-2);
    border-right:1px solid var(--border); border-bottom:1px solid var(--border);
  }
  .cal-cell{
    min-height: 92px;
    background: var(--surface);
    border-right:1px solid var(--border); border-bottom:1px solid var(--border);
    padding: 6px;
    display:flex; flex-direction:column; gap:4px;
    cursor:pointer;
  }
  .cal-cell:hover{ background: var(--surface-2); }
  .cal-cell.empty{ background: var(--bg); cursor:default; }
  .cal-cell.selected{ outline: 2px solid var(--accent); outline-offset:-2px; }
  .cal-date{ font-size:11.5px; font-weight:700; color:var(--ink-2); }
  .cal-cell.today .cal-date{
    color: var(--accent-ink); background: var(--accent);
    width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  }
  .cal-chip{
    font-size:10px; font-weight:700; color:#fff;
    padding:1.5px 5px; border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .cal-more{ font-size:10px; color: var(--ink-muted); font-weight:700; }

  .cal-day-detail{ display:flex; flex-direction:column; gap:8px; }

  /* ---------------- Table (Invoices) ---------------- */
  .table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius: var(--radius); background:var(--surface); }
  table{ width:100%; border-collapse:collapse; min-width: 720px; }
  thead th{
    text-align:left; font-size:11px; font-weight:700; color: var(--ink-muted);
    background: var(--surface-2); padding: 10px 12px; border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  tbody td{ padding: 10px 12px; border-bottom:1px solid var(--border); font-size:12.5px; vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr.overdue{ box-shadow: inset 3px 0 0 var(--critical); }
  .amount-cell{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight:700; }
  .summary-strip{ display:grid; grid-template-columns: repeat(4,1fr); gap:14px; }

  /* ---------------- Modal ---------------- */
  .modal-backdrop{
    position:fixed; inset:0; background: rgba(11,11,11,0.45);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background: var(--surface); border-radius: var(--radius); border:1px solid var(--border);
    width: 420px; max-width:100%; padding:20px; box-shadow: var(--shadow);
    display:flex; flex-direction:column; gap:14px;
  }
  .modal h2{ font-size:15px; margin:0; font-weight:800; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:12px; font-weight:700; color: var(--ink-2); }
  .field input, .field select{
    padding: 8px 10px; border-radius:7px; border:1px solid var(--border-strong);
    background: var(--bg); width:100%;
  }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:4px; }

  /* ---------------- Toast ---------------- */
  .toast{
    position:fixed; bottom:22px; left:50%; transform: translateX(-50%) translateY(12px);
    background: var(--ink); color: var(--bg);
    padding: 10px 18px; border-radius: 999px; font-size:12.5px; font-weight:600;
    box-shadow: var(--shadow); opacity:0; pointer-events:none; transition: all .2s ease;
    z-index: 60;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 980px){
    .app{ grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .sidebar{
      flex-direction:row; align-items:center; gap:10px;
      padding: 10px 12px; overflow-x:auto;
      border-right:none; border-bottom:1px solid var(--border);
    }
    .brand{ flex-shrink:0; padding:0; }
    .brand-sub{ display:none; }
    .nav{ flex-direction:row; gap:4px; }
    .nav-item{ flex-shrink:0; width:auto; padding:8px 12px; }
    .sidebar-spacer, .user-card{ display:none; }
    .kpi-row{ grid-template-columns: repeat(2,1fr); }
    .grid-2{ grid-template-columns: 1fr; }
    .summary-strip{ grid-template-columns: repeat(2,1fr); }
    .topbar{ flex-wrap:wrap; row-gap:10px; padding: 14px 16px; }
    .topbar-title{ font-size:17px; }
    .topbar > div:first-child{ flex: 1 1 100%; }
    .view{ padding: 16px 16px 48px; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">FH</div>
      <div>
        <div class="brand-name">FreelanceHub</div>
        <div class="brand-sub">외주 통합 관리</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="overview">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M3 10l7-7 7 7M5 8.5V17h10V8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>대시보드</span>
      </button>
      <button class="nav-item" data-view="board">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="4" height="12" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="8.5" y="4" width="4" height="8" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="4" width="4" height="5" rx="1" stroke="currentColor" stroke-width="1.6"/></svg>
        <span>프로젝트 보드</span>
      </button>
      <button class="nav-item" data-view="calendar">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><rect x="3" y="4.5" width="14" height="12" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M3 8h14M6.5 3v3M13.5 3v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>마감 캘린더</span>
        <span class="nav-badge" id="badge-deadlines" hidden>0</span>
      </button>
      <button class="nav-item" data-view="invoices">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M5 3h10v14l-2.5-1.5L10 17l-2.5-1.5L5 17V3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.5 7h5M7.5 10h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>정산 관리</span>
        <span class="nav-badge" id="badge-invoices" hidden>0</span>
      </button>
    </nav>

    <div class="sidebar-spacer"></div>
    <div class="user-card">
      <div class="user-avatar">김</div>
      <div>
        <div class="user-name">김서경</div>
        <div class="user-role">프리랜서 디자이너</div>
      </div>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title" id="topbar-title">대시보드</div>
        <div class="topbar-date" id="topbar-date"></div>
      </div>
      <div class="topbar-spacer"></div>
      <button class="btn btn-ghost btn-sm" id="btn-reset">데모 데이터 초기화</button>
      <button class="btn btn-primary" id="btn-add-project">+ 새 프로젝트</button>
    </div>

    <!-- ---------- VIEW: OVERVIEW ---------- -->
    <section class="view active" id="view-overview">
      <div class="kpi-row" id="kpi-row"></div>

      <div class="grid-2">
        <div class="card">
          <div class="card-head">
            <h3>마감 임박 (7일 이내)</h3>
            <span class="pill pill-neutral" id="deadline-count-pill">0건</span>
          </div>
          <div id="deadline-list"></div>
        </div>
        <div class="card">
          <div class="card-head"><h3>클라이언트별 현황</h3></div>
          <div id="client-list"></div>
        </div>
      </div>
    </section>

    <!-- ---------- VIEW: BOARD ---------- -->
    <section class="view" id="view-board">
      <div>
        <p class="section-title">프로젝트 보드</p>
        <p class="section-sub">클라이언트별로 필터링하고, 카드의 상태를 바꿔 진행 단계를 관리하세요.</p>
        <div class="filter-row" id="client-filter-row"></div>
      </div>
      <div class="board" id="board"></div>
      <div class="legend" id="board-legend"></div>
    </section>

    <!-- ---------- VIEW: CALENDAR ---------- -->
    <section class="view" id="view-calendar">
      <div class="cal-head">
        <button class="btn btn-sm" id="cal-prev">‹</button>
        <div class="cal-title" id="cal-title"></div>
        <button class="btn btn-sm" id="cal-next">›</button>
        <button class="btn btn-sm btn-ghost" id="cal-today">오늘</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="legend" id="cal-legend"></div>

      <div class="card cal-day-detail">
        <div class="card-head"><h3 id="cal-detail-title">날짜를 선택하세요</h3></div>
        <div id="cal-detail-list"></div>
      </div>
    </section>

    <!-- ---------- VIEW: INVOICES ---------- -->
    <section class="view" id="view-invoices">
      <div>
        <p class="section-title">정산 관리</p>
        <p class="section-sub">청구 · 입금 상태를 단계별로 관리하고 미수금을 추적하세요.</p>
      </div>

      <div class="summary-strip" id="invoice-summary"></div>

      <div class="filter-row" id="invoice-filter-row"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>클라이언트</th>
              <th>프로젝트</th>
              <th>금액</th>
              <th>정산 예정일</th>
              <th>상태</th>
              <th>액션</th>
            </tr>
          </thead>
          <tbody id="invoice-tbody"></tbody>
        </table>
      </div>
    </section>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <form class="modal" id="add-form">
    <h2>새 프로젝트 등록</h2>
    <div class="field">
      <label for="f-client">클라이언트</label>
      <select id="f-client"></select>
    </div>
    <div class="field">
      <label for="f-title">프로젝트명</label>
      <input id="f-title" type="text" placeholder="예: 브랜드 리뉴얼 디자인" required />
    </div>
    <div class="field-row">
      <div class="field">
        <label for="f-amount">계약 금액 (원)</label>

      </div>

        <label for="f-due">마감일</label>
        <input id="f-due" type="date" required />

      <select id="f-status">
        <option value="inquiry">문의</option>

        <option value="progress" selected>진행중</option>
        <option value="review">검토중</option>
        <option value="done">완료</option>
      </select>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn" id="btn-cancel-modal">취소</button>
      <button type="submit" class="btn btn-primary">등록하기</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ============================================================
     DATA MODEL
     ============================================================ */
  var STORAGE_KEY = "freelancehub_v1";

  var STATUS_META = {
    inquiry:  { label:"문의",    pill:"pill-neutral" },
    proposal: { label:"제안중",  pill:"pill-info" },
    progress: { label:"진행중",  pill:"pill-info" },
    review:   { label:"검토중",  pill:"pill-warning" },
    done:     { label:"완료",    pill:"pill-good" }
  };
  var STATUS_ORDER = ["inquiry","proposal","progress","review","done"];

  var INVOICE_META = {
    unbilled: { label:"미청구",   pill:"pill-neutral", next:"billed",  action:"청구하기" },
    billed:   { label:"청구완료", pill:"pill-info",    next:"pending", action:"입금대기로 변경" },
    pending:  { label:"입금대기", pill:"pill-warning", next:"paid",    action:"입금 확인" },
    paid:     { label:"입금완료", pill:"pill-good",    next:null,      action:null }
  };
  var INVOICE_ORDER = ["unbilled","billed","pending","paid"];

  // Categorical client colors — fixed order (identity), violet reserved for brand accent.
  var CLIENT_COLORS_LIGHT = ["#eb6834","#1baf7a","#eda100","#e87ba4","#008300","#e34948","#2a78d6"];
  var CLIENT_COLORS_DARK  = ["#d95926","#199e70","#c98500","#d55181","#008300","#e66767","#3987e5"];

  function isDark(){
    var stamp = document.documentElement.getAttribute("data-theme");
    if (stamp === "dark") return true;
    if (stamp === "light") return false;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function clientColor(idx){
    var arr = isDark() ? CLIENT_COLORS_DARK : CLIENT_COLORS_LIGHT;
    return arr[idx % arr.length];
  }

  function addDays(n){
    var d = new Date();
    d.setHours(0,0,0,0);
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0,10);
  }

  function seedData(){
    var clients = [
      { id:"c1", name:"스튜디오 오르에", meta:"브랜딩 에이전시" },
      { id:"c2", name:"그린테이블",     meta:"F&B 스타트업" },
      { id:"c3", name:"마루상사",       meta:"이커머스" },
      { id:"c4", name:"다인병원",       meta:"헬스케어" },
      { id:"c5", name:"브라이트에듀",   meta:"에듀테크" }
    ];

    var projects = [
      { id:"p1", clientId:"c1", title:"브랜드 리뉴얼 로고 디자인", amount:4200000, due:addDays(-2), status:"review",   progress:85 },
      { id:"p2", clientId:"c1", title:"브랜드 가이드북 제작",       amount:1800000, due:addDays(9),  status:"progress", progress:40 },
      { id:"p3", clientId:"c2", title:"패키지 디자인 3종",         amount:2600000, due:addDays(3),  status:"progress", progress:60 },
      { id:"p4", clientId:"c2", title:"메뉴판 & POP 디자인",       amount:900000,  due:addDays(21), status:"inquiry",  progress:5 },
      { id:"p5", clientId:"c3", title:"쇼핑몰 상세페이지 10종",     amount:3000000, due:addDays(1),  status:"progress", progress:70 },
      { id:"p6", clientId:"c3", title:"시즌 배너 세트",             amount:600000,  due:addDays(30), status:"proposal", progress:0 },
      { id:"p7", clientId:"c4", title:"병원 브로슈어 디자인",       amount:1500000, due:addDays(6),  status:"review",   progress:90 },
      { id:"p8", clientId:"c5", title:"온라인 강의 썸네일 세트",     amount:1200000, due:addDays(-5), status:"done",     progress:100 },
      { id:"p9", clientId:"c5", title:"에듀테크 앱 UI 키트",        amount:5200000, due:addDays(14), status:"progress", progress:25 },
      { id:"p10",clientId:"c4", title:"병원 리브랜딩 제안서",       amount:800000,  due:addDays(45), status:"proposal", progress:0 }
    ];

    var invoices = [
      { id:"i1", projectId:"p1", amount:4200000, due:addDays(4),  status:"unbilled" },
      { id:"i2", projectId:"p5", amount:1500000, due:addDays(2),  status:"pending" },
      { id:"i3", projectId:"p7", amount:1500000, due:addDays(10), status:"billed" },
      { id:"i4", projectId:"p8", amount:1200000, due:addDays(-8), status:"pending" },
      { id:"i5", projectId:"p3", amount:1300000, due:addDays(-3), status:"pending" },
      { id:"i6", projectId:"p9", amount:2000000, due:addDays(18), status:"unbilled" },
      { id:"i7", projectId:"p2", amount:900000,  due:addDays(25), status:"unbilled" }
    ];

    return { clients: clients, projects: projects, invoices: invoices, nextId: 11 };
  }

  var state = loadState();

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    }catch(e){}
    var s = seedData();
    saveState(s);
    return s;
  }
  function saveState(s){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s || state));
  }

  function clientById(id){
    for (var i=0;i<state.clients.length;i++) if (state.clients[i].id === id) return state.clients[i];
    return null;
  }
  function clientIndex(id){
    for (var i=0;i<state.clients.length;i++) if (state.clients[i].id === id) return i;
    return 0;
  }
  function projectById(id){
    for (var i=0;i<state.projects.length;i++) if (state.projects[i].id === id) return state.projects[i];
    return null;
  }

  /* ============================================================
     HELPERS
     ============================================================ */
  function fmtWon(n){ return "₩" + Math.round(n).toLocaleString("ko-KR"); }

  function todayStr(){
    var d = new Date(); d.setHours(0,0,0,0);
    return d.toISOString().slice(0,10);
  }
  function daysUntil(dateStr){
    var today = new Date(todayStr());
    var target = new Date(dateStr);
    return Math.round((target - today) / 86400000);
  }
  function ddayLabel(dateStr){
    var n = daysUntil(dateStr);
    if (n === 0) return "D-day";
    if (n > 0) return "D-" + n;
    return "D+" + Math.abs(n) + " 지남";
  }
  function ddayTone(dateStr){
    var n = daysUntil(dateStr);
    if (n < 0) return "critical";
    if (n <= 3) return "serious";
    if (n <= 7) return "warning";
    return "neutral";
  }
  function fmtDate(dateStr){
    var d = new Date(dateStr);
    return (d.getMonth()+1) + "월 " + d.getDate() + "일";
  }

  function toast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.classList.remove("show"); }, 1800);
  }

  /* ============================================================
     NAVIGATION
     ============================================================ */
  var TITLES = { overview:"대시보드", board:"프로젝트 보드", calendar:"마감 캘린더", invoices:"정산 관리" };
  function switchView(view){
    document.querySelectorAll(".nav-item").forEach(function(b){ b.classList.toggle("active", b.dataset.view === view); });
    document.querySelectorAll(".view").forEach(function(v){ v.classList.toggle("active", v.id === "view-" + view); });
    document.getElementById("topbar-title").textContent = TITLES[view];
    if (view === "calendar") renderCalendar();
  }
  document.getElementById("nav").addEventListener("click", function(e){
    var btn = e.target.closest(".nav-item");
    if (btn) switchView(btn.dataset.view);
  });

  /* ============================================================
     RENDER: OVERVIEW
     ============================================================ */
  function renderOverview(){
    var inProgress = state.projects.filter(function(p){ return p.status === "progress" || p.status === "review"; });
    var monthAhead = state.invoices.filter(function(inv){ return daysUntil(inv.due) <= 30 && daysUntil(inv.due) >= -60; });
    var expectedThisMonth = monthAhead.reduce(function(sum,inv){ return sum + inv.amount; }, 0);
    var dueSoon = state.projects.filter(function(p){ return p.status !== "done" && daysUntil(p.due) <= 7; });
    var receivable = state.invoices.filter(function(inv){ return inv.status === "billed" || inv.status === "pending"; });
    var receivableTotal = receivable.reduce(function(sum,inv){ return sum + inv.amount; }, 0);

    var kpis = [
      { label:"진행중 프로젝트", value: inProgress.length + "건", note:"검토중 포함 · 전체 " + state.projects.length + "건 중", tone:"info" },
      { label:"이번달 예상 정산액", value: fmtWon(expectedThisMonth), note:"향후 30일 내 정산 예정 인보이스 기준", tone:"good" },
      { label:"마감 임박 (7일 이내)", value: dueSoon.length + "건", note: dueSoon.length ? "가장 임박: " + fmtDate(dueSoon.sort(function(a,b){return daysUntil(a.due)-daysUntil(b.due);})[0].due) : "임박한 마감 없음", tone:"serious" },
      { label:"미수금 총액", value: fmtWon(receivableTotal), note: receivable.length + "건의 청구완료·입금대기 인보이스", tone:"warning" }
    ];
    var toneVar = { info:"var(--info)", good:"var(--good)", serious:"var(--serious)", warning:"var(--warning)" };

    document.getElementById("kpi-row").innerHTML = kpis.map(function(k){
      return '<div class="kpi-tile">' +
        '<div class="kpi-label"><span class="kpi-dot" style="background:'+toneVar[k.tone]+'"></span>'+k.label+'</div>' +
        '<div class="kpi-value">'+k.value+'</div>' +
        '<div class="kpi-note">'+k.note+'</div>' +
      '</div>';
    }).join("");

    // deadline list
    var upcoming = state.projects
      .filter(function(p){ return p.status !== "done"; })
      .slice()
      .sort(function(a,b){ return daysUntil(a.due) - daysUntil(b.due); })
      .slice(0,6);

    document.getElementById("deadline-count-pill").textContent = dueSoon.length + "건";

    var dl = document.getElementById("deadline-list");
    if (!upcoming.length){
      dl.innerHTML = '<div class="empty-note">등록된 마감 일정이 없습니다.</div>';
    } else {
      dl.innerHTML = upcoming.map(function(p){
        var c = clientById(p.clientId);
        var tone = ddayTone(p.due);
        return '<div class="deadline-row">' +
          '<span class="client-dot" style="background:'+clientColor(clientIndex(p.clientId))+'"></span>' +
          '<div class="deadline-main">' +
            '<div class="deadline-title">'+escapeHtml(p.title)+'</div>' +
            '<div class="deadline-sub">'+escapeHtml(c.name)+' · '+fmtDate(p.due)+'</div>' +
          '</div>' +
          '<span class="pill pill-'+tone+'">'+ddayLabel(p.due)+'</span>' +
        '</div>';
      }).join("");
    }

    // client overview
    var cl = document.getElementById("client-list");
    cl.innerHTML = state.clients.map(function(c, idx){
      var cProjects = state.projects.filter(function(p){ return p.clientId === c.id; });
      var active = cProjects.filter(function(p){ return p.status !== "done"; }).length;
      var cInvoices = state.invoices.filter(function(inv){
        var p = projectById(inv.projectId);
        return p && p.clientId === c.id;
      });
      var receivableAmt = cInvoices.filter(function(inv){ return inv.status==="billed"||inv.status==="pending"; })
        .reduce(function(s,inv){return s+inv.amount;},0);
      var total = cProjects.reduce(function(s,p){return s+p.amount;},0);
      return '<div class="client-mini">' +
        '<div class="client-avatar" style="background:'+clientColor(idx)+'">'+escapeHtml(c.name.slice(0,1))+'</div>' +
        '<div>' +
          '<div class="client-mini-name">'+escapeHtml(c.name)+'</div>' +
          '<div class="client-mini-meta">'+escapeHtml(c.meta)+' · 진행중 '+active+'건</div>' +
        '</div>' +
        '<div class="client-mini-amount">'+fmtWon(total) +
          (receivableAmt>0 ? '<span class="receivable">미수금 '+fmtWon(receivableAmt)+'</span>' : '') +
        '</div>' +
      '</div>';
    }).join("");

    // badges
    var badgeD = document.getElementById("badge-deadlines");
    if (dueSoon.length){ badgeD.hidden=false; badgeD.textContent = dueSoon.length; } else { badgeD.hidden=true; }
    var overdueInvoices = state.invoices.filter(function(inv){ return inv.status!=="paid" && daysUntil(inv.due) < 0; });
    var badgeI = document.getElementById("badge-invoices");
    if (overdueInvoices.length){ badgeI.hidden=false; badgeI.textContent = overdueInvoices.length; } else { badgeI.hidden=true; }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ============================================================
     RENDER: BOARD (Kanban)
     ============================================================ */
  var boardFilter = "all";

  function renderClientFilterRow(){
    var row = document.getElementById("client-filter-row");
    var chips = ['<button class="chip'+(boardFilter==="all"?" active":"")+'" data-client="all">전체</button>']
      .concat(state.clients.map(function(c, idx){
        return '<button class="chip'+(boardFilter===c.id?" active":"")+'" data-client="'+c.id+'">' +
          '<span class="swatch" style="background:'+clientColor(idx)+'"></span>'+escapeHtml(c.name)+'</button>';
      }));
    row.innerHTML = chips.join("");
  }
  document.getElementById("client-filter-row").addEventListener("click", function(e){
    var chip = e.target.closest(".chip");
    if (!chip) return;
    boardFilter = chip.dataset.client;
    renderClientFilterRow();
    renderBoard();
  });

  function renderBoard(){
    var board = document.getElementById("board");
    var projects = state.projects.filter(function(p){ return boardFilter==="all" || p.clientId===boardFilter; });

    board.innerHTML = STATUS_ORDER.map(function(statusKey){
      var colProjects = projects.filter(function(p){ return p.status === statusKey; });
      var cardsHtml = colProjects.map(function(p){
        var c = clientById(p.clientId);
        var tone = p.status==="done" ? "good" : ddayTone(p.due);
        return '<div class="proj-card">' +
          '<div class="proj-card-top">' +
            '<div style="flex:1">' +
              '<div class="proj-client"><span class="client-dot" style="background:'+clientColor(clientIndex(p.clientId))+'"></span>'+escapeHtml(c.name)+'</div>' +
              '<div class="proj-title">'+escapeHtml(p.title)+'</div>' +
            '</div>' +
          '</div>' +
          '<div class="proj-meta">' +
            '<span class="proj-amount">'+fmtWon(p.amount)+'</span>' +
            '<span class="pill pill-'+tone+'">'+(p.status==="done" ? "완료" : ddayLabel(p.due))+'</span>' +
          '</div>' +
          '<div class="proj-progress-track"><div class="proj-progress-fill" style="width:'+p.progress+'%"></div></div>' +
          '<select class="proj-select" data-project="'+p.id+'">' +
            STATUS_ORDER.map(function(s){ return '<option value="'+s+'"'+(s===p.status?" selected":"")+'>'+STATUS_META[s].label+'</option>'; }).join("") +
          '</select>' +
        '</div>';
      }).join("");

      return '<div class="board-col">' +
        '<div class="board-col-head"><span class="board-col-title">'+STATUS_META[statusKey].label+'</span><span class="board-col-count">'+colProjects.length+'</span></div>' +
        '<div class="board-cards">'+(cardsHtml || '<div class="empty-note">카드 없음</div>')+'</div>' +
      '</div>';
    }).join("");

    board.querySelectorAll(".proj-select").forEach(function(sel){
      sel.addEventListener("change", function(){
        var p = projectById(sel.dataset.project);
        p.status = sel.value;
        if (sel.value === "done") p.progress = 100;
        saveState();
        renderBoard();
        renderOverview();
        toast("'"+p.title+"' 상태를 '"+STATUS_META[sel.value].label+"'(으)로 변경했습니다");
      });
    });

    document.getElementById("board-legend").innerHTML = state.clients.map(function(c, idx){
      return '<div class="legend-item"><span class="legend-swatch" style="background:'+clientColor(idx)+'"></span>'+escapeHtml(c.name)+'</div>';
    }).join("");
  }

  /* ============================================================
     RENDER: CALENDAR
     ============================================================ */
  var calDate = new Date(); calDate.setDate(1);
  var selectedDay = todayStr();

  function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

  function renderCalendar(){
    var y = calDate.getFullYear(), m = calDate.getMonth();
    document.getElementById("cal-title").textContent = y + "년 " + (m+1) + "월";

    var first = new Date(y, m, 1);
    var startOffset = first.getDay(); // 0 = Sun
    var daysInMonth = new Date(y, m+1, 0).getDate();

    var dowNames = ["일","월","화","수","목","금","토"];
    var cellsHtml = dowNames.map(function(d){ return '<div class="cal-dow">'+d+'</div>'; }).join("");

    var totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
    for (var i=0; i<totalCells; i++){
      var dayNum = i - startOffset + 1;
      if (dayNum < 1 || dayNum > daysInMonth){
        cellsHtml += '<div class="cal-cell empty"></div>';
        continue;
      }
      var cellDate = new Date(y, m, dayNum);
      var dateStr = ymd(cellDate);
      var isToday = dateStr === todayStr();
      var deadlines = state.projects.filter(function(p){ return p.due === dateStr; });

      var chips = deadlines.slice(0,2).map(function(p){
        return '<div class="cal-chip" style="background:'+clientColor(clientIndex(p.clientId))+'" title="'+escapeHtml(p.title)+'">'+escapeHtml(p.title)+'</div>';
      }).join("");
      var more = deadlines.length > 2 ? '<div class="cal-more">+'+(deadlines.length-2)+'건 더</div>' : "";

      cellsHtml += '<div class="cal-cell'+(isToday?" today":"")+(dateStr===selectedDay?" selected":"")+'" data-date="'+dateStr+'">' +
        '<span class="cal-date">'+dayNum+'</span>' + chips + more +
      '</div>';
    }
    document.getElementById("cal-grid").innerHTML = cellsHtml;

    document.getElementById("cal-grid").querySelectorAll(".cal-cell[data-date]").forEach(function(cell){
      cell.addEventListener("click", function(){
        selectedDay = cell.dataset.date;
        renderCalendar();
        renderCalDetail();
      });
    });

    document.getElementById("cal-legend").innerHTML = state.clients.map(function(c, idx){
      return '<div class="legend-item"><span class="legend-swatch" style="background:'+clientColor(idx)+'"></span>'+escapeHtml(c.name)+'</div>';
    }).join("");

    renderCalDetail();
  }

  function renderCalDetail(){
    var items = state.projects.filter(function(p){ return p.due === selectedDay; });
    document.getElementById("cal-detail-title").textContent = fmtDate(selectedDay) + " 마감 일정 (" + items.length + "건)";
    var list = document.getElementById("cal-detail-list");
    if (!items.length){
      list.innerHTML = '<div class="empty-note">이 날짜에 마감 예정인 프로젝트가 없습니다.</div>';
      return;
    }
    list.innerHTML = items.map(function(p){
      var c = clientById(p.clientId);
      return '<div class="deadline-row">' +
        '<span class="client-dot" style="background:'+clientColor(clientIndex(p.clientId))+'"></span>' +
        '<div class="deadline-main">' +
          '<div class="deadline-title">'+escapeHtml(p.title)+'</div>' +
          '<div class="deadline-sub">'+escapeHtml(c.name)+' · '+fmtWon(p.amount)+'</div>' +
        '</div>' +
        '<span class="pill '+STATUS_META[p.status].pill+'">'+STATUS_META[p.status].label+'</span>' +
      '</div>';
    }).join("");
  }

  document.getElementById("cal-prev").addEventListener("click", function(){ calDate.setMonth(calDate.getMonth()-1); renderCalendar(); });
  document.getElementById("cal-next").addEventListener("click", function(){ calDate.setMonth(calDate.getMonth()+1); renderCalendar(); });
  document.getElementById("cal-today").addEventListener("click", function(){ calDate = new Date(); calDate.setDate(1); selectedDay = todayStr(); renderCalendar(); });

  /* ============================================================
     RENDER: INVOICES
     ============================================================ */
  var invoiceFilter = "all";

  function renderInvoiceFilterRow(){
    var counts = {};
    INVOICE_ORDER.forEach(function(k){ counts[k] = state.invoices.filter(function(i){return i.status===k;}).length; });
    var chips = ['<button class="chip'+(invoiceFilter==="all"?" active":"")+'" data-status="all">전체 '+state.invoices.length+'</button>']
      .concat(INVOICE_ORDER.map(function(k){
        return '<button class="chip'+(invoiceFilter===k?" active":"")+'" data-status="'+k+'">'+INVOICE_META[k].label+' '+counts[k]+'</button>';
      }));
    document.getElementById("invoice-filter-row").innerHTML = chips.join("");
  }
  document.getElementById("invoice-filter-row").addEventListener("click", function(e){
    var chip = e.target.closest(".chip");
    if (!chip) return;
    invoiceFilter = chip.dataset.status;
    renderInvoiceFilterRow();
    renderInvoices();
  });

  function renderInvoices(){
    var total = state.invoices.reduce(function(s,i){return s+i.amount;},0);
    var paid = state.invoices.filter(function(i){return i.status==="paid";}).reduce(function(s,i){return s+i.amount;},0);
    var receivable = state.invoices.filter(function(i){return i.status==="billed"||i.status==="pending";}).reduce(function(s,i){return s+i.amount;},0);
    var overdue = state.invoices.filter(function(i){return i.status!=="paid" && daysUntil(i.due)<0;});

    var summary = [
      { label:"전체 계약 금액", value: fmtWon(total), tone:"info" },
      { label:"입금 완료", value: fmtWon(paid), tone:"good" },
      { label:"미수금 (청구완료+입금대기)", value: fmtWon(receivable), tone:"warning" },
      { label:"연체 건수", value: overdue.length+"건", tone:"critical" }
    ];
    var toneVar = { info:"var(--info)", good:"var(--good)", warning:"var(--warning)", critical:"var(--critical)" };
    document.getElementById("invoice-summary").innerHTML = summary.map(function(s){
      return '<div class="kpi-tile">' +
        '<div class="kpi-label"><span class="kpi-dot" style="background:'+toneVar[s.tone]+'"></span>'+s.label+'</div>' +
        '<div class="kpi-value">'+s.value+'</div>' +
      '</div>';
    }).join("");

    var rows = state.invoices.filter(function(i){ return invoiceFilter==="all" || i.status===invoiceFilter; })
      .slice()
      .sort(function(a,b){ return daysUntil(a.due) - daysUntil(b.due); });

    var tbody = document.getElementById("invoice-tbody");
    if (!rows.length){
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-note">해당하는 인보이스가 없습니다.</div></td></tr>';
    } else {
      tbody.innerHTML = rows.map(function(inv){
        var p = projectById(inv.projectId);
        var c = clientById(p.clientId);
        var isOverdue = inv.status!=="paid" && daysUntil(inv.due) < 0;
        var meta = INVOICE_META[inv.status];
        return '<tr class="'+(isOverdue?"overdue":"")+'">' +
          '<td><span class="client-dot" style="background:'+clientColor(clientIndex(p.clientId))+';display:inline-block;margin-right:6px;"></span>'+escapeHtml(c.name)+'</td>' +
          '<td>'+escapeHtml(p.title)+'</td>' +
          '<td class="amount-cell">'+fmtWon(inv.amount)+'</td>' +
          '<td>'+fmtDate(inv.due)+(isOverdue?' <span class="pill pill-critical">'+ddayLabel(inv.due)+'</span>':'')+'</td>' +
          '<td><span class="pill '+meta.pill+'">'+meta.label+'</span></td>' +
          '<td>'+(meta.next ? '<button class="btn btn-sm" data-invoice="'+inv.id+'" data-next="'+meta.next+'">'+meta.action+'</button>' : '<span class="empty-note">-</span>')+'</td>' +
        '</tr>';
      }).join("");
    }

    tbody.querySelectorAll("[data-invoice]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var inv = state.invoices.find(function(i){ return i.id === btn.dataset.invoice; });
        inv.status = btn.dataset.next;
        saveState();
        renderInvoiceFilterRow();
        renderInvoices();
        renderOverview();
        toast("정산 상태를 '"+INVOICE_META[inv.status].label+"'(으)로 변경했습니다");
      });
    });
  }

  /* ============================================================
     ADD PROJECT MODAL
     ============================================================ */
  var backdrop = document.getElementById("modal-backdrop");
  function openModal(){
    var sel = document.getElementById("f-client");
    sel.innerHTML = state.clients.map(function(c){ return '<option value="'+c.id+'">'+escapeHtml(c.name)+'</option>'; }).join("");
    document.getElementById("f-due").value = addDays(14);
    backdrop.classList.add("open");
  }
  function closeModal(){ backdrop.classList.remove("open"); document.getElementById("add-form").reset(); }

  document.getElementById("btn-add-project").addEventListener("click", openModal);
  document.getElementById("btn-cancel-modal").addEventListener("click", closeModal);
  backdrop.addEventListener("click", function(e){ if (e.target === backdrop) closeModal(); });

  document.getElementById("add-form").addEventListener("submit", function(e){
    e.preventDefault();
    var id = "p" + (state.nextId++);
    var status = document.getElementById("f-status").value;
    state.projects.unshift({
      id: id,
      clientId: document.getElementById("f-client").value,
      title: document.getElementById("f-title").value.trim() || "이름 없는 프로젝트",
      amount: Number(document.getElementById("f-amount").value) || 0,
      due: document.getElementById("f-due").value || addDays(14),
      status: status,
      progress: status === "done" ? 100 : 0
    });
    saveState();
    closeModal();
    renderAll();
    toast("새 프로젝트를 등록했습니다");
  });

  /* ============================================================
     RESET
     ============================================================ */
  document.getElementById("btn-reset").addEventListener("click", function(){
    if (!confirm("데모 데이터를 초기 상태로 되돌릴까요? 지금까지의 변경 사항이 사라집니다.")) return;
    state = seedData();
    saveState();
    renderAll();
    toast("데모 데이터를 초기화했습니다");
  });

  /* ============================================================
     BOOT
     ============================================================ */
  function renderAll(){
    renderClientFilterRow();
    renderInvoiceFilterRow();
    renderOverview();
    renderBoard();
    renderInvoices();
    if (document.getElementById("view-calendar").classList.contains("active")) renderCalendar();
  }

  document.getElementById("topbar-date").textContent = new Date().toLocaleDateString("ko-KR", { year:"numeric", month:"long", day:"numeric", weekday:"long" });

  renderAll();
})();
</script>
</body>
</html>
